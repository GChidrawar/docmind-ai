<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DocMind — AI Document Assistant</title>
    <meta name="description" content="Upload documents and chat with them: semantic search, grounded answers with citations, and a view of every indexed chunk." />
    <meta name="application-name" content="DocMind" />
    <!-- Updated by themeStore on toggle: dark #0a1020, light #ffffff -->
    <meta name="theme-color" content="#0a1020" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        if (localStorage.getItem('docmind.theme') === 'light') {
          document.documentElement.classList.remove('dark')
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#ffffff')
        }
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>DocMind needs JavaScript to run.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
